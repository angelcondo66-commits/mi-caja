<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Caja</title>
<meta name="theme-color" content="#0E151C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Caja">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#F2F5F7;--surface:#FFFFFF;--ink:#112031;--muted:#5C6B7A;--line:#DCE3E9;--accent:#0E7C66;--accent-ink:#FFFFFF;--danger:#B3321F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E151C;--surface:#17212B;--ink:#E8EEF3;--muted:#93A3B2;--line:#27343F;--accent:#3CC3A5;--accent-ink:#06211B;--danger:#FF8B77;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E151C;--surface:#17212B;--ink:#E8EEF3;--muted:#93A3B2;--line:#27343F;--accent:#3CC3A5;--accent-ink:#06211B;--danger:#FF8B77;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:20px 18px 56px}
.top{display:flex;justify-content:flex-end;margin-bottom:10px}
.top select{width:auto;min-height:40px;padding:6px 10px}
h1{font-size:clamp(2rem,9vw,2.8rem);line-height:1.05;font-weight:800;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 18px}
.total{position:sticky;top:8px;z-index:5;background:var(--ink);color:var(--bg);border-radius:20px;padding:16px 22px;margin-bottom:22px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.total small{display:block;opacity:.75;font-size:.95rem}
.total strong{font-size:clamp(2.2rem,11vw,3.2rem);font-weight:800;letter-spacing:-.03em;line-height:1.1}
section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
h2{font-size:1.1rem;margin:0 0 14px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap}
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px}
.f{flex:1 1 140px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:46px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer}
.add{width:100%;margin-top:14px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;min-height:48px;font-weight:600}
.alt{background:none;color:var(--accent);border:1px solid var(--accent);border-radius:10px;min-height:46px;padding:0 14px;font-weight:600;white-space:nowrap}
.newcat{display:flex;gap:8px;margin-top:10px}
.err{color:var(--danger);font-size:.9rem;min-height:1.2em;margin:8px 0 0}
.bar{margin-bottom:12px}
.bar .t{display:flex;justify-content:space-between;gap:8px;font-size:.95rem;margin-bottom:4px}
.bar .t span:last-child{color:var(--muted);white-space:nowrap}
.track{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px;transition:width .3s}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.info{flex:1;min-width:0}
.info b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info span{font-size:.85rem;color:var(--muted)}
.amt{font-weight:600;white-space:nowrap}
.del{background:none;border:0;color:var(--muted);font-size:1.3rem;min-width:40px;min-height:40px;border-radius:8px}
.del:hover{color:var(--danger)}
.empty{color:var(--muted);margin:0}
.stats{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:8px;font-size:.9rem;opacity:.85}.pos{color:var(--accent)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}.brand img{border-radius:14px}.brand h1{margin:0}.empty.err{color:var(--danger)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top"><select id="lang" aria-label="Idioma / Language">
    <option value="es">Español</option><option value="en">English</option>
    <option value="pt">Português</option><option value="fr">Français</option>
  </select></div>
  <div class="brand"><img src="icons/logo-112.png" alt="" width="56" height="56"><h1>Mi Caja</h1></div>
  <p class="sub" data-i="sub"></p>

  <div class="total"><small data-i="cash"></small><strong id="total">0</strong><div class="stats"><span id="inM"></span><span id="mes"></span></div></div>

  <section>
    <h2 data-i="inTitle"></h2>
    <div class="row">
      <div class="f"><label for="imonto" data-i="amount"></label><input id="imonto" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div>
      <div class="f"><label for="itipo" data-i="inType"></label><select id="itipo"></select></div>
    </div>
    <button class="add" id="addin" type="button" data-i="inSave"></button>
    <p class="err" id="ierr" role="alert"></p>
  </section>

  <section>
    <h2 data-i="addTitle"></h2>
    <div class="row">
      <div class="f"><label for="monto" data-i="amount"></label><input id="monto" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div>
      <div class="f"><label for="cat" data-i="category"></label><select id="cat"></select></div>
    </div>
    <div style="margin-top:10px"><label for="nota" data-i="note"></label><input id="nota" type="text" maxlength="40" data-p="notePh"></div>
    <button class="add" id="add" type="button" data-i="save"></button>
    <p class="err" id="err" role="alert"></p>
  </section>

  <section>
    <h2 data-i="where"></h2>
    <div id="bars"></div>
  </section>

  <section>
    <h2 data-i="list"></h2>
    <ul id="lista"></ul>
  </section>

  <section>
    <h2 data-i="moreTitle"></h2>
    <label for="newcat" data-i="moreLabel"></label>
    <div class="newcat"><input id="newcat" type="text" maxlength="24" data-p="morePh"><button class="alt" id="addcat" type="button" data-i="moreBtn"></button></div>
    <p class="err" id="err2" role="alert"></p>
  </section>
  <section>
    <h2 data-i="bkTitle"></h2>
    <p class="empty" data-i="bkText" style="margin-bottom:12px"></p>
    <div class="row"><button class="alt" id="bkExp" type="button" data-i="bkExp"></button><button class="alt" id="bkImp" type="button" data-i="bkImp"></button></div>
    <input id="bkFile" type="file" accept=".json,application/json" hidden>
    <p class="empty" id="bkMsg" role="status" style="margin-top:10px"></p>
    <p class="empty" id="bkLast"></p>
  </section>
</main>

};
var X={es:{cash:"Disponible en caja",inM:"Ingresos de {m}",inTitle:"Registrar un ingreso",inType:"Tipo",inSave:"Guardar ingreso",salary:"Salario",extra:"Ingreso adicional",otherIn:"Otro ingreso",list:"Movimientos del mes",delIn:"Borrar ingreso"},en:{cash:"Cash available",inM:"Income in {m}",inTitle:"Add income",inType:"Type",inSave:"Save income",salary:"Salary",extra:"Extra income",otherIn:"Other income",list:"This month's activity",delIn:"Delete income"},pt:{cash:"Disponível em caixa",inM:"Receitas de {m}",inTitle:"Registrar uma receita",inType:"Tipo",inSave:"Salvar receita",salary:"Salário",extra:"Renda extra",otherIn:"Outra receita",list:"Movimentos do mês",delIn:"Apagar receita"},fr:{cash:"Disponible en caisse",inM:"Revenus de {m}",inTitle:"Ajouter un revenu",inType:"Type",inSave:"Enregistrer le revenu",salary:"Salaire",extra:"Revenu supplémentaire",otherIn:"Autre revenu",list:"Mouvements du mois",delIn:"Supprimer le revenu"}};
for(var k in X)Object.assign(L[k],X[k]);

: "Dernière sauvegarde : {d}", "bkNever": "Vous n’avez pas encore de sauvegarde. Nous vous conseillons d’en télécharger une."}};
for(var k2 in X2)Object.assign(L[k2],X2[k2]);
function fillInc(){var s=$("itipo"),v=s.value;s.innerHTML=["salary","extra","otherIn"].map(function(k){return '<option value="'+k+'">'+T()[k]+'</option>'}).join("");if(v)s.value=v}
var DEF=[["food","#E0742B"],["transport","#2F7DD1"],["home","#7A5FD0"],["fun","#D6457F"],["health","#1E9E6A"],["other","#7C8794"]];
var PAL=["#B8860B","#008B8B","#8E44AD","#C0392B","#2C7A7B","#6B8E23"];
var LEG={Comida:"food",Transporte:"transport",Casa:"home",Ocio:"fun",Salud:"health",Otros:"other"};
function $(id){return document.getElementById(id)}
function rd(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var items=rd("gastos-v1",[]);if(!Array.isArray(items))items=[];
items.forEach(function(i){if(LEG[i.c])i.c=LEG[i.c]});
var custom=rd("gastos-cats",[]);if(!Array.isArray(custom))custom=[];
var inc=rd("gastos-ing",[]);if(!Array.isArray(inc))inc=[];
var lang=rd("gastos-lang",null);
if(!L[lang]){var n=(navigator.language||"es").slice(0,2);lang=L[n]?n:"es"}
function T(){return L[lang]}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function money(n){return (n<0?"-":"")+"$"+Math.abs(n).toLocaleString(lang,{maximumFractionDigits:2})}
function cat(id){
  for(var i=0;i<DEF.length;i++)if(DEF[i][0]===id)return{name:T().cats[id],color:DEF[i][1]};
  for(var j=0;j<custom.length;j++)if(custom[j].id===id)return{name:custom[j].name,color:custom[j].color};
  return{name:id,color:"#7C8794"};
}
function fillSelect(keep){
  var s=$("cat"),h="";
  DEF.forEach(function(c){h+='<option value="'+c[0]+'">'+esc(T().cats[c[0]])+'</option>'});
  custom.forEach(function(c){h+='<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>'});
  s.innerHTML=h;if(keep)s.value=keep;
}
function applyLang(){
  document.documentElement.lang=lang;document.title="Mi Caja";$("lang").value=lang;
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=T()[e.getAttribute("data-i")]});
  document.querySelectorAll("[data-p]").forEach(function(e){e.placeholder=T()[e.getAttribute("data-p")]});
  fillSelect($("cat").value);fillInc();render();
}
var now=new Date(),ym=now.getFullYear()+"-"+(now.getMonth()+1);
function inMonth(it){var d=new Date(it.t);return d.getFullYear()+"-"+(d.getMonth()+1)===ym}
function render(){bkInfo();
  var m=items.filter(inMonth).sort(function(a,b){return b.t-a.t});
  var tot=m.reduce(function(s,i){return s+i.a},0);
  $("mes").textContent=T().spent.replace("{m}",now.toLocaleDateString(lang,{month:"long"}))+": "+money(tot);
  var mn=now.toLocaleDateString(lang,{month:"long"}),sum=function(a){return a.reduce(function(s,i){return s+i.a},0)},bal=sum(inc)-sum(items);
  $("total").textContent=money(bal);$("total").style.color=bal<0?"#FF8B77":"";
  $("inM").textContent=T().inM.replace("{m}",mn)+": "+money(sum(inc.filter(inMonth)));
  var by={};m.forEach(function(i){by[i.c]=(by[i.c]||0)+i.a});
  var keys=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
  $("bars").innerHTML=keys.length?keys.map(function(k){var p=Math.round(by[k]/tot*100),c=cat(k);
    return '<div class="bar"><div class="t"><span>'+esc(c.name)+'</span><span>'+money(by[k])+' · '+p+'%</span></div><div class="track"><div class="fill" style="width:'+p+'%;background:'+c.color+'"></div></div></div>'}).join(""):'<p class="empty">'+T().noData+'</p>';
  $("lista").innerHTML=m.length?m.map(function(i){var c=cat(i.c),d=new Date(i.t).toLocaleDateString(lang,{day:"numeric",month:"short"});
    return '<li><span class="dot" style="background:'+c.color+'"></span><div class="info"><b>'+esc(i.n||c.name)+'</b><span>'+esc(c.name)+' · '+d+'</span></div><span class="amt">'+money(i.a)+'</span><button class="del" type="button" aria-label="'+T().del+'" data-id="'+i.id+'">×</button></li>'}).join(""):'<p class="empty">'+T().nothing+'</p>';
  var mi=inc.filter(inMonth).sort(function(a,b){return b.t-a.t});
  if(mi.length)$("lista").innerHTML=mi.map(function(i){var d=new Date(i.t).toLocaleDateString(lang,{day:"numeric",month:"short"});
    return '<li><span class="dot" style="background:var(--accent)"></span><div class="info"><b>'+esc(T()[i.k]||T().extra)+'</b><span>'+d+'</span></div><span class="amt pos">+'+money(i.a)+'</span><button class="del" type="button" aria-label="'+T().delIn+'" data-k="in" data-id="'+i.id+'">×</button></li>'}).join("")+(m.length?$("lista").innerHTML:"");
}
$("lang").onchange=function(){lang=this.value;wr("gastos-lang",lang);applyLang()};
$("add").onclick=function(){

  $("err").textContent="";
  items.push({id:Date.now()+"",a:a,c:$("cat").value,n:$("nota").value.trim(),t:Date.now()});
  wr("gastos-v1",items);$("monto").value="";$("nota").value="";$("monto").focus();render();
};
$("addin").onclick=function(){
  var a=parseFloat($("imonto").value);
  if(!(a>0)){$("ierr").textContent=T().errAmt;$("imonto").focus();return}
  $("ierr").textContent="";

  wr("gastos-ing",inc);$("imonto").value="";render();
};
$("addcat").onclick=function(){
  var name=$("newcat").value.trim(),low=name.toLowerCase();
  var dup=!name||custom.some(function(c){return c.name.toLowerCase()===low})||DEF.some(function(c){return T().cats[c[0]].toLowerCase()===low});
  if(dup){$("err2").textContent=T().errCat;$("newcat").focus();return}
  $("err2").textContent="";
  var c={id:"c"+Date.now(),name:name,color:PAL[custom.length%PAL.length]};
  custom.push(c);wr("gastos-cats",custom);$("newcat").value="";fillSelect(c.id);render();$("monto").focus();
};
$("lista").onclick=function(e){var b=e.target.closest(".del");if(!b)return;
  var id=b.getAttribute("data-id");
  if(b.getAttribute("data-k")==="in"){inc=inc.filter(function(i){return i.id!==id});wr("gastos-ing",inc)}
  else{items=items.filter(function(i){return i.id!==id});wr("gastos-v1",items)}
  render()};
function bkInfo(){var t=rd("gastos-bk",0),n=items.length+inc.length,el=$("bkLast"),old=t&&Date.now()-t>2592e6;
  el.textContent=t?T().bkLast.replace("{d}",new Date(t).toLocaleDateString(lang,{day:"numeric",month:"long",year:"numeric"})):(n?T().bkNever:"");
  el.className=(n&&(!t||old))?"empty err":"empty"}
$("bkExp").onclick=function(){
  var d={app:"micaja",v:1,t:Date.now(),items:items,inc:inc,custom:custom};
  var b=new Blob([JSON.stringify(d)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download="mi-caja-respaldo-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
  wr("gastos-bk",Date.now());$("bkMsg").textContent=T().bkDone;bkInfo()};
$("bkImp").onclick=function(){$("bkFile").click()};
$("bkFile").onchange=function(){
  var inp=this,f=inp.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{
    var d=JSON.parse(r.result);
    if(!d||d.app!=="micaja"||!Array.isArray(d.items)||!Array.isArray(d.inc))throw 0;
    var mg=function(cur,add,ok){var ids={};cur.forEach(function(x){ids[x.id]=1});add.forEach(function(x){if(x&&x.id&&!ids[x.id]&&ok(x)){cur.push(x);ids[x.id]=1}})};
    mg(items,d.items,function(x){return x.a>0&&typeof x.c==="string"});
    mg(inc,d.inc,function(x){return x.a>0&&["salary","extra","otherIn"].indexOf(x.k)>=0});
    if(Array.isArray(d.custom))mg(custom,d.custom,function(x){return typeof x.name==="string"});
